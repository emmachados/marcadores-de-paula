[project]
name = "marcadores-de-paula"
dynamic = ["version"]
description = "Desktop application for research transcription with WhisperX, speaker diarization, audio-linked review and annotation"
readme = "README.md"
authors = [{ name = "Emma Machado de Souza" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials==6.12.0; sys_platform == 'darwin'",
  "PySide6-Addons==6.12.0; sys_platform == 'darwin'",
  "PySide6-Essentials==6.12.0; sys_platform != 'darwin'",
  "PySide6-Addons==6.12.0; sys_platform != 'darwin'",
  "keyring>=25,<26",
  "python-docx>=1.1,<2",
  "yt-dlp[default]>=2026.3.17",
  "uv>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "pyinstaller>=6", "numpy>=2.2,<3"]

[project.scripts]
marcadores-de-paula = "transcript_desk.app:main"

[project.urls]
Homepage = "https://github.com/emmachados/marcadores-de-paula"
Documentation = "https://github.com/emmachados/marcadores-de-paula/tree/main/docs"
Issues = "https://github.com/emmachados/marcadores-de-paula/issues"
Changelog = "https://github.com/emmachados/marcadores-de-paula/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "transcript_desk.__version__" }

[tool.setuptools.packages.find]
include = ["transcript_desk*"]

[tool.setuptools.package-data]
transcript_desk = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
